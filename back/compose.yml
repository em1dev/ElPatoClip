name: clip-backend

services:
  clip-api:
    build: .
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    ports:
      - ${PORT}:80
    environment:
      - PORT=80
      - APP_ID=${APP_ID}
      - AUTH_URL=${AUTH_URL}
    networks:
      - shared
      - default

networks:
  shared:
    external: true
    name: auth-internal-network
